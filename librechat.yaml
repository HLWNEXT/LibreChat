version: 1.3.13

fileStrategy: "azure_blob"

mcpSettings:
  allowedAddresses:
    - "localhost:3978"

mcpServers:
  hr-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/hr"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  bim-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/bim"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  bim-training-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/bim-training"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  deltek-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/deltek"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

interface:
  customWelcome: "Hey {{user.name}}, Norm here. What are we solving today?"

endpoints:
  azureOpenAI:
    groups:
      - group: "HLW"
        apiKey: "${AZURE_OPENAI_API_KEY}"
        instanceName: "next-chatbot"
        version: "2025-04-01-preview"
        models:
          gpt-5.2-chat:
            deploymentName: "gpt-5.2-chat"
