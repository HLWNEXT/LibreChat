version: 1.3.13

mcpServers:
  hr-search:
    type: stdio
    command: npx
    args:
      - --prefix
      - D:/Github/hlw-chatbot-dev
      - tsx
      - D:/Github/hlw-chatbot-dev/src/mcp-servers/hr/index.ts
    env:
      AZURE_AI_SEARCH_ENDPOINT: "${AZURE_AI_SEARCH_ENDPOINT}"
      AZURE_AI_SEARCH_API_KEY: "${AZURE_AI_SEARCH_API_KEY}"
      HR_AZURE_AI_SEARCH_INDEX_NAMES: "${HR_AZURE_AI_SEARCH_INDEX_NAMES}"
      DELTEK_AZURE_AI_SEARCH_INDEX_NAME: "${DELTEK_AZURE_AI_SEARCH_INDEX_NAME}"

  bim-search:
    type: stdio
    command: npx
    args:
      - --prefix
      - D:/Github/hlw-chatbot-dev
      - tsx
      - D:/Github/hlw-chatbot-dev/src/mcp-servers/bim/index.ts
    env:
      AZURE_AI_SEARCH_ENDPOINT: "${AZURE_AI_SEARCH_ENDPOINT}"
      AZURE_AI_SEARCH_API_KEY: "${AZURE_AI_SEARCH_API_KEY}"
      BIM_AZURE_AI_SEARCH_INDEX_NAMES: "${BIM_AZURE_AI_SEARCH_INDEX_NAMES}"

  bim-training-search:
    type: stdio
    command: npx
    args:
      - --prefix
      - D:/Github/hlw-chatbot-dev
      - tsx
      - D:/Github/hlw-chatbot-dev/src/mcp-servers/bim-training/index.ts
    env:
      PS_AZURE_AI_SEARCH_ENDPOINT: "${PS_AZURE_AI_SEARCH_ENDPOINT}"
      PS_AZURE_AI_SEARCH_API_KEY: "${PS_AZURE_AI_SEARCH_API_KEY}"
      PS_AZURE_AI_SEARCH_INDEX_NAME: "${PS_AZURE_AI_SEARCH_INDEX_NAME}"

  deltek-search:
    type: stdio
    command: npx
    args:
      - --prefix
      - D:/Github/hlw-chatbot-dev
      - tsx
      - D:/Github/hlw-chatbot-dev/src/mcp-servers/deltek/index.ts
    env:
      AZURE_AI_SEARCH_ENDPOINT: "${AZURE_AI_SEARCH_ENDPOINT}"
      AZURE_AI_SEARCH_API_KEY: "${AZURE_AI_SEARCH_API_KEY}"
      DELTEK_AZURE_AI_SEARCH_INDEX_NAME: "${DELTEK_AZURE_AI_SEARCH_INDEX_NAME}"
      HR_AZURE_AI_SEARCH_INDEX_NAMES: "${HR_AZURE_AI_SEARCH_INDEX_NAMES}"

interface:
  customWelcome: "Hey {{user.name}}, Norm here. What are we solving today?"

endpoints:
  azureOpenAI:
    groups:
      - group: "HLW"
        apiKey: "${AZURE_OPENAI_API_KEY}"
        instanceName: "next-chatbot"
        version: "2025-04-01-preview"
        models:
          gpt-5.2-chat:
            deploymentName: "gpt-5.2-chat"
