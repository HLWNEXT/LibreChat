version: 1.3.13

fileStrategy: "azure_blob"

mcpServers:
  hr-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/hr"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  bim-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/bim"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  bim-training-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/bim-training"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  deltek-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/deltek"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  rfp-search:
    type: streamable-http
    url: "${MCP_BASE_URL}/mcp/rfp"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  elastic-agent-builder:
    type: streamable-http
    url: "${KIBANA_URL}api/agent_builder/mcp"
    headers:
      Authorization: "ApiKey ${ELASTIC_AGENT_BUILDER_API_KEY}"

  ai-image-engine:
    type: streamable-http
    url: "http://52.191.27.240:8189/mcp"
    headers:
      Authorization: "Bearer ${COMFYMCP_SECRET_TOKEN}"
      X-User-Email: "{{LIBRECHAT_USER_EMAIL}}"

interface:
  customWelcome: "Hey {{user.name}}, Norm here. What are we solving today?"

memory:
  personalize: true
  agent:
    enabled: true
    provider: "azureOpenAI"
    model: "gpt-5.2-chat"
    instructions: "You are a memory management assistant. Store and manage user information accurately, capturing durable facts, preferences, and context worth remembering across conversations."
    model_parameters:
      temperature: 0.1

endpoints:
  azureOpenAI:
    groups:
      - group: "HLW"
        apiKey: "${AZURE_OPENAI_API_KEY}"
        instanceName: "next-chatbot"
        version: "2025-04-01-preview"
        models:
          gpt-5.2-chat:
            deploymentName: "gpt-5.2-chat"
          gpt-5.6-luna:
            deploymentName: "gpt-5.6-luna"

