version: 1.3.13

mcpServers:
  hr-search:
    type: sse
    url: "${MCP_BASE_URL}/mcp/hr/sse"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  bim-search:
    type: sse
    url: "${MCP_BASE_URL}/mcp/bim/sse"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  bim-training-search:
    type: sse
    url: "${MCP_BASE_URL}/mcp/bim-training/sse"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

  deltek-search:
    type: sse
    url: "${MCP_BASE_URL}/mcp/deltek/sse"
    headers:
      Authorization: "Bearer ${MCP_SECRET_TOKEN}"

interface:
  customWelcome: "Hey {{user.name}}, Norm here. What are we solving today?"

endpoints:
  azureOpenAI:
    groups:
      - group: "HLW"
        apiKey: "${AZURE_OPENAI_API_KEY}"
        instanceName: "next-chatbot"
        version: "2025-04-01-preview"
        models:
          gpt-5.2-chat:
            deploymentName: "gpt-5.2-chat"
